[workspace]
resolver = "2"
members = [
    "crates/arca-cli",
    "crates/arca-config",
    "crates/arca-config-toml",
    "crates/arca-core",
    "crates/arca-ops",
    "crates/arca-shell",
    "crates/arca-testkit",
    "crates/arca-tui",
    "crates/arca-vault",
    "crates/arca-vault-age",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/arca"
description = "Secrets broker for agents — sealed, not spilled: arca:// references, a redacting Secret type, env-injection instead of plaintext"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
arca = { path = "crates/arca-cli", version = "0.1.0" }
arca-config = { path = "crates/arca-config", version = "0.1.0" }
arca-config-toml = { path = "crates/arca-config-toml", version = "0.1.0" }
arca-core = { path = "crates/arca-core", version = "0.1.0" }
arca-ops = { path = "crates/arca-ops", version = "0.1.0" }
arca-shell = { path = "crates/arca-shell", version = "0.1.0" }
arca-testkit = { path = "crates/arca-testkit", version = "0.1.0" }
arca-tui = { path = "crates/arca-tui", version = "0.1.0" }
arca-vault = { path = "crates/arca-vault", version = "0.1.0" }
arca-vault-age = { path = "crates/arca-vault-age", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
schemars = "1"
tempfile = "3"
temp-env = "0.3"
sigpipe = "0.1"
zeroize = "1"
# age (rage's Rust impl) — the fixed crypto choice per ADR-0001.
# default-features off: no async/armor/plugin/ssh — binary
# ciphertext, sync API, light dep tree.
age = { version = "0.12", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
