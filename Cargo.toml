[workspace]
resolver = "2"
members = [
    "crates/cuora-cli",
    "crates/cuora-config",
    "crates/cuora-config-toml",
    "crates/cuora-core",
    "crates/cuora-deploy",
    "crates/cuora-deploy-cf",
    "crates/cuora-identity",
    "crates/cuora-identity-file",
    "crates/cuora-identity-keyring",
    "crates/cuora-notice",
    "crates/cuora-ops",
    "crates/cuora-serve",
    "crates/cuora-shell",
    "crates/cuora-testkit",
    "crates/cuora-tui",
    "crates/cuora-vault",
    "crates/cuora-vault-age",
    "crates/cuora-vault-cached",
    "crates/cuora-vault-cf",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/cuora"
description = "Secrets broker for agents — sealed, not spilled"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
cuora = { path = "crates/cuora-cli", version = "0.1.0" }
cuora-config = { path = "crates/cuora-config", version = "0.1.0" }
cuora-config-toml = { path = "crates/cuora-config-toml", version = "0.1.0" }
cuora-core = { path = "crates/cuora-core", version = "0.1.0" }
cuora-deploy = { path = "crates/cuora-deploy", version = "0.1.0" }
cuora-deploy-cf = { path = "crates/cuora-deploy-cf", version = "0.1.0" }
cuora-identity = { path = "crates/cuora-identity", version = "0.1.0" }
cuora-identity-file = { path = "crates/cuora-identity-file", version = "0.1.0" }
cuora-identity-keyring = { path = "crates/cuora-identity-keyring", version = "0.1.0" }
cuora-notice = { path = "crates/cuora-notice", version = "0.1.0" }
cuora-ops = { path = "crates/cuora-ops", version = "0.1.0" }
cuora-serve = { path = "crates/cuora-serve", version = "0.1.0" }
cuora-shell = { path = "crates/cuora-shell", version = "0.1.0" }
cuora-testkit = { path = "crates/cuora-testkit", version = "0.1.0" }
cuora-tui = { path = "crates/cuora-tui", version = "0.1.0" }
cuora-vault = { path = "crates/cuora-vault", version = "0.1.0" }
cuora-vault-age = { path = "crates/cuora-vault-age", version = "0.1.0" }
cuora-vault-cached = { path = "crates/cuora-vault-cached", version = "0.1.0" }
cuora-vault-cf = { path = "crates/cuora-vault-cf", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
schemars = "1"
tempfile = "3"
temp-env = "0.3"
proptest = "1"
sigpipe = "0.1"
rpassword = "7"
# `serde` so Zeroizing<String> can sit inside serde structs
# (cuora-vault-age's Entry) — values still scrub on drop.
zeroize = { version = "1", features = ["serde"] }
# age (rage's Rust impl) — the fixed crypto choice per ADR-0001.
# default-features off: no async/armor/plugin/ssh — binary
# ciphertext, sync API, light dep tree.
age = { version = "0.12", default-features = false }
# Blocking HTTP for remote vaults/deploys — sync only, no async
# runtime (AGENTS.md). Pinned to a >7-day-old release on purpose.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
base64 = "0.23"
# keyring-core + one native store per platform — the sync
# `CredentialStore` model (no async runtime; the dbus store is the
# synchronous libdbus client, `vendored` so no system -dev needed).
keyring-core = "1"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
dbus-secret-service = "4"
dbus = "0.9"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
hmac = "0.12"
sha2 = "0.10"
ratatui = "0.30"
crossterm = "0.29"
clap-markdown = "0.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
unwrap_used = "warn"
