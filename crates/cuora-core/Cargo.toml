[package]
name = "cuora-core"
description = "cuora domain core: cuora:// refs, redacting Secret, env axis, actor, config model — pure, no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["secrets", "cuora"]
categories = ["development-tools"]

[features]
default = []
# Derive schemars::JsonSchema on the public model — `cuora schema`.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
# Self-dep so `cargo test` compiles the `schema` feature code.
cuora-core = { path = ".", features = ["schema"] }
serde_json.workspace = true
toml.workspace = true
proptest.workspace = true

[lints]
workspace = true
