[package]
name = "cuora-driver"
description = "tamias-driver-cuora — pavo view driver over cuora vault metadata (read-only; never renders secret values)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cuora", "secrets", "pavo", "driver"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-cuora"
path = "src/main.rs"

[dependencies]
cuora-core.workspace = true
cuora-ops.workspace = true
cuora-vault.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# The public wire contract — git dep so `cargo install --git` and
# `cargo xtask install` work without a sibling ../pavo checkout
# (path deps break workspace resolution on a fresh clone).
# `version` is the crates.io fallback once pavo-protocol publishes.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
# Driver-authoring kit — the ndjson `serve` loop plus the
# manifest/ViewSpec/QueryBinding/ViewNode builders this crate used to
# hand-roll. Same git source as pavo-protocol (they resolve to one
# rev); `version` is the crates.io fallback once it publishes.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-cuora serve` binary.
# Git dep to match pavo-protocol above (path deps break
# `cargo install --git` / fresh-clone resolution).
pavo-testkit = { git = "https://github.com/9aia/pavo" }

[lints]
workspace = true
