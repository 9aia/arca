[package]
name = "cuora-driver"
description = "tamias-driver-cuora — pavo view driver over cuora vault metadata (read-only; never renders secret values), engine ops dispatching to the cuora lib, and the sealed-pack surface (seal/open/materialize/recipients over tamias ADR-0004 ciphertext-only packs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cuora", "secrets", "pavo", "driver"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-cuora"
path = "src/main.rs"

[features]
# `mcp` embeds pavo-driver-kit's surface layer — the `mcp` argv verb
# serves this driver's ops manifest as MCP tools on stdio, equivalent
# to the standalone tamias-driver-mcp minus the PATH/discovery hop.
# (`cli` is NOT a feature: it's the tamias `bins[]` shim verb — an
# engine passthrough that needs nothing optional.)
default = []
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
cuora.workspace = true
cuora-core.workspace = true
cuora-ops.workspace = true
cuora-sealed.workspace = true
cuora-vault.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# Sealed packs (tamias ADR-0004): age recipient keys for `seal`'s
# --keyfile/--recipient handling — the encrypt/decrypt/store
# machinery itself lives in cuora-sealed.
age.workspace = true
# The sealed-pack manifest contract — `Manifest`/`Sealed` for the
# lifecycle verbs + `sealed_json`. Git dep like pavo-protocol
# above (path deps break fresh-clone resolution).
tamias-core = { git = "https://github.com/9aia/tamias", version = "0.1" }
# The public wire contract — git dep so `cargo install --git` and
# `cargo xtask install` work without a sibling ../pavo checkout
# (path deps break workspace resolution on a fresh clone).
# `version` is the crates.io fallback once pavo-protocol publishes.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
# Driver-authoring kit — the ndjson `serve` loop plus the
# manifest/ViewSpec/QueryBinding/ViewNode builders this crate used to
# hand-roll. Same git source as pavo-protocol (they resolve to one
# rev); `version` is the crates.io fallback once it publishes.
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-cuora serve` binary.
# Git dep to match pavo-protocol above (path deps break
# `cargo install --git` / fresh-clone resolution).
pavo-testkit = { git = "https://github.com/9aia/pavo" }
tempfile.workspace = true
# The engine CLI e2e suite lives here now (tests/{smoke,verbs,
# edges,cloud}.rs): the `cuora` command is a tamias shim → this
# binary's `run`/`cli` verbs, so the spawned surface under test is
# `tamias-driver-cuora` itself.
temp-env.workspace = true
cuora-testkit.workspace = true

[lints]
workspace = true
