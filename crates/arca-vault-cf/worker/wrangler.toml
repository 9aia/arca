name = "arca"
main = "index.js"
compatibility_date = "2025-10-01"

# Create the database first:
#   wrangler d1 create arca-vault
# then paste the real database_id below.
[[d1_databases]]
binding = "DB"
database_name = "arca"
database_id = "4b0fbf31-5dac-48f4-ab88-bdf5ec6c0f3f"

# The bearer token is NOT here — set it with:
#   wrangler secret put ARCA_VAULT_TOKEN

[[routes]]
pattern = "arca.luisfuturist.com"
custom_domain = true
