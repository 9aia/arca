[package]
name = "cuora"
description = "cuora — secrets broker for agents: reference URIs, redaction, env-injection CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["secrets", "cuora"]
categories = ["development-tools"]

# No [[bin]] — the `cuora` command ships as a tamias pack
# (libraries/cuora): a generated shim → `tamias bin exec` →
# tamias-driver-cuora's `cli` passthrough → this lib's `run_from`.
# This crate is the engine only.

[dependencies]
cuora-core = { workspace = true, features = ["schema"] }
cuora-config.workspace = true
cuora-config-toml.workspace = true
cuora-ops.workspace = true
cuora-serve.workspace = true
cuora-shell.workspace = true
cuora-vault.workspace = true
clap.workspace = true
clap-markdown.workspace = true
serde_json.workspace = true
schemars.workspace = true
sigpipe.workspace = true
rpassword.workspace = true

[dev-dependencies]
tempfile.workspace = true
temp-env.workspace = true

[lints]
workspace = true
