# arca.toml — repo-level arca config (dogfooding). Search order:
# --config → $ARCA_CONFIG → ./arca.toml → ~/.config/arca/arca.toml.
# Secrets are refs, never values.

# The declared secret surface — what `arca run`/`arca env` may inject.
# The adversarial campaign (campaigns/adversarial/) runs under
# `arca run --env dev -- peregrin campaign run …`, so its credentials
# arrive through here. Fake values are all the campaign needs:
#
#   printf 'fake-devin-token' | arca put arca://agents/devin
#   printf 'fake-cf-token'    | arca put arca://cf/token
#
# Values live in the 9aia CF vault (arca.9aia.com, Gaia account);
# the local age vault keeps only the scoped-token refs below.

[envs]
dev     = { vault = "nine" }
staging = { vault = "nine" }
preview = { vault = "nine" }
prod    = { vault = "nine" }

[vaults.nine]
kind = "cf"
url = "https://arca.9aia.com"
token_env = "ARCA_CF_TOKEN"
cache = ["dev", "preview"] # prod reads live — no stale-prod footgun

[vaults.nine.tokens]
dev     = "arca://9aia/cf-token-dev"
staging = "arca://9aia/cf-token-staging"
preview = "arca://9aia/cf-token-preview"
prod    = "arca://9aia/cf-token-prod"

[secrets]
# agent-runner credential the campaign's agent nodes may consume
DEVIN_API_KEY = "arca://agents/devin"
# cf-vault bearer — materializes only when a [vaults.cloud] is wired
ARCA_CF_TOKEN = "arca://cf/token"
